{{- if and .Values.incidentReportService.enabled .Values.incidentReportService.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: incident-report-service-hpa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: incident-report-service
    app.kubernetes.io/name: urbanflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: incident-report-service
  minReplicas: {{ .Values.incidentReportService.hpa.minReplicas }}
  maxReplicas: {{ .Values.incidentReportService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.incidentReportService.hpa.cpuUtilization }}
{{- end }}
