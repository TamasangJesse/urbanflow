{{- if .Values.ragService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: rag-service
    app.kubernetes.io/name: urbanflow
spec:
  type: ClusterIP
  selector:
    app: rag-service
  ports:
    - name: http
      port: {{ .Values.ragService.port }}
      targetPort: {{ .Values.ragService.port }}
{{- end }}
