apiVersion: v1
kind: Secret
metadata:
  name: urbanflow-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: urbanflow
type: Opaque
data:
  # PostgreSQL — exact names from .env
  POSTGRES_USER: {{ .Values.secrets.postgresUser }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb }}

  # MongoDB — exact names from .env
  MONGO_USER: {{ .Values.secrets.mongoUser }}
  MONGO_PASSWORD: {{ .Values.secrets.mongoPassword }}
  MONGO_DB: {{ .Values.secrets.mongoDb }}

  # Redis — exact name from .env
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword }}

  # App — exact name from .env (read via os.getenv("SECRET_KEY"))
  SECRET_KEY: {{ .Values.secrets.secretKey }}

  # External API keys
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey }}
  VITE_GOOGLE_MAPS_API_KEY: {{ .Values.secrets.viteMapsApiKey }}
